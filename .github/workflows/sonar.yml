name: Sonar Analysis

on:
    # Test with branch develop by default (settings configuration in GitHub repository)
  workflow_run:
    workflows: ["CI - Tests and Coverage"]
    types:
      - completed

jobs:
  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest

    steps:
        # Check out repository code
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configuration Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Compilation du back
        run: mvn clean compile
        working-directory: back

      - name: Download rapport JaCoCo
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report
          path: back/target/site/jacoco/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download rapport coverage front
        uses: actions/download-artifact@v4
        with:
          name: coverage-report-front
          path: front/coverage/bobapp/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}