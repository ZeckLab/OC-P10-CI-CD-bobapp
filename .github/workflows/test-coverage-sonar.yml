name: CI - Tests and Coverage - Sonar Analysis

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  back-tests:
    name: Tests Back-end (Java 11)
    runs-on: ubuntu-latest

    steps:
      # Check out repository code
      - uses: actions/checkout@v6
      # Set up JDK 11
      - uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
      # Run tests
      - run: mvn clean test
        working-directory: back
      # Upload rapport JaCoCo
      - uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: back/target/site/jacoco/

  front-tests:
    name: Tests Front-end (Node.js)
    runs-on: ubuntu-latest

    steps:
      # Check out repository code
      - uses: actions/checkout@v6
      # Set up Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      # dependencies installation
      - run: npm install
        working-directory: front
      # Run tests
      - run: npm run test -- --watch=false --browsers=ChromeHeadless --code-coverage
        working-directory: front
      # Upload rapport Front
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report-front
          path: front/coverage/bobapp/

  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: [back-tests, front-tests]
    steps:
      # Check out repository code
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Set up JDK 11
      - uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
      # Run compilation to generate files for SonarCloud
      - run: mvn clean compile
        working-directory: back
      # Download rapport JaCoCo
      - uses: actions/download-artifact@v4
        with:
          name: jacoco-report
          path: back/target/site/jacoco/
      # Download rapport coverage front
      - uses: actions/download-artifact@v4
        with:
          name: coverage-report-front
          path: front/coverage/bobapp/
      # Run SonarCloud analysis
      - uses: SonarSource/sonarqube-scan-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}